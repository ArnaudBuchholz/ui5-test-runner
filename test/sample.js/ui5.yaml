specVersion: "3.2"
metadata:
  name: sample.js
type: application
resources:
  configuration:
    paths:
      webapp: ./test/sample.js/webapp
framework:
  name: OpenUI5
  version: "1.139.0"
  libraries:
    - name: sap.ui.core
    - name: sap.f
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.codeeditor
    - name: sap.ui.documentation
    - name: themelib_sap_horizon
server:
  settings:
    httpPort: 8080
  customMiddleware:
  - name: "@ui5/middleware-code-coverage"
    afterMiddleware: compression
    configuration:
      instrument:
        produceSourceMap: true
        coverageGlobalScope: "window.top"
        coverageGlobalScopeFunc: false
      excludePatterns:
        - "resources/"
  - name: ui5-tooling-modules-middleware
    afterMiddleware: "@ui5/middleware-code-coverage"
---
specVersion: '3.2'
kind: extension
type: project-shim
metadata:
  name: thirdparty
shims:
  configurations:
    # QUnit has to be provided as shim because with the ui5-tooling-modules-middleware
    # we can't load the script and CSS in the test setup html file
    qunit:
      specVersion: '3.2'
      type: module
      metadata:
        name: qunit
      resources:
        configuration:
          paths:
            /resources/thirdparty/qunit/: ''
