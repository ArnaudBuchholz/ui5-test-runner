<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="expires" content="0" />
		<meta charset="utf-8" />
		<title>Isolation fixture for the UI5 Application: sample.js</title>
		<link rel="stylesheet" type="text/css" href="../resources/sap/ui/thirdparty/qunit-2.css" />
		<script src="../resources/sap/ui/thirdparty/qunit-2.js"></script>
		<script>
			QUnit.test("storage is isolated per page", function (assert) {
				// Cookies are scoped to the browser context, not shimmed by the agent
				// (unlike localStorage in parallel mode). Under isolation "none" a cookie
				// set by an earlier page in the shared context is visible here; under
				// isolation "context" each page gets a fresh jar, so it is not.
				//
				// Max-Age (not a session cookie) is required: the runner closes each page
				// before opening the next, and a session cookie is not reliably flushed to
				// the context cookie store on page close (observed passing locally but not on
				// headless CI). A persisted cookie is written through immediately and survives
				// the close. It does not leak across runs: each run launches a fresh browser
				// with a throwaway profile (no userDataDir), so the jar starts empty regardless.
				var seen = document.cookie.indexOf("utrIsolationSentinel=1") !== -1;
				document.cookie = "utrIsolationSentinel=1; path=/; max-age=3600; SameSite=Lax";
				assert.strictEqual(seen, false, "no sentinel from a previous page (fresh storage jar)");
			});
		</script>
	</head>
	<body>
		<div id="qunit"></div>
		<div id="qunit-fixture"></div>
	</body>
</html>
