[user]
question="""
How do I migrate to ui5-test-runner 6 ?
"""

[files]
"package.json" = """
{
  "scripts": {
    "test": "ui5-test-runner"
  },
  "devDependencies": {
    "ui5-test-runner": "^5"
  }
}
"""

"ui5-test-runner.json" = """
{
  "url": ["https://ui5.sap.com/test-resources/sap/m/demokit/orderbrowser/webapp/test/testsuite.qunit.html"],
  "noScreenshot": null,
  "coverage": null,
  "coverageTempDir": "report/.nyc_output",
  "coverageReportDir": "report/coverage",
  "coverageProxy": null,
  "coverageProxyInclude": "/webapp/",
  "coverageProxyExclude": "/resources/|/webapp/test/",
  "browserArgs": ["--unsecure"]
}
"""

[expected]
v6 = "It should explain how to migrate the project to ui5-test-runner version 6"
coverage_proxy = "it should explain that the experimental coverage proxy options (coverageProxy, coverageProxyInclude, coverageProxyExclude) are no more supported"
