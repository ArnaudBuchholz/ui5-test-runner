[user]
question="""
How do I migrate to ui5-test-runner 6 ?
"""

[meta]
skip = true
skipReason = "deferred: multi-sub-option browser case (driver, capabilities) stays flaky — needs multi-criterion stabilization and the criteria are wording-strict"

[files]
"package.json" = """
{
  "scripts": {
    "test": "ui5-test-runner"
  },
  "devDependencies": {
    "ui5-test-runner": "^5"
  }
}
"""

"ui5-test-runner.json" = """
{
  "capabilities": null,
  "browser": "$/webdriverio.js",
  "browserArgs": ["--unsecure"]
}
"""

[expected]
v6 = "It should explain how to migrate the project to ui5-test-runner version 6"
driver = "it should explain that the browser command script is replaced by selecting the automation engine with --driver (webdriverio) and the browser with --browser"
capabilities = "it should explain that the capabilities option is no more supported"
