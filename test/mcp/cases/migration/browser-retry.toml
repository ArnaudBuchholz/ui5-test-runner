[user]
question="""
How do I migrate to ui5-test-runner 6 ?
"""

[files]
"package.json" = """
{
  "scripts": {
    "test": "ui5-test-runner"
  },
  "devDependencies": {
    "ui5-test-runner": "^5"
  }
}
"""

"ui5-test-runner.json" = """
{
  "url": ["http://localhost:8080/test/unit/device.qunit.html"],
  "browser": "$/puppeteer.js",
  "browserArgs": ["--device", "no-such-device"],
  "browserRetry": 0
}
"""

[expected]
v6 = "It should explain how to migrate the project to ui5-test-runner version 6"
browser-retry = "it should explain that the browserRetry (--browser-retry) option is no more supported"
